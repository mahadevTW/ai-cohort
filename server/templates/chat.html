<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Assistant</title>
    <style>
        :root {
            --ink-900: #14171f;
            --ink-700: #232837;
            --ink-500: #3a4152;
            --paper: #eef1f4;
            --paper-card: #ffffff;
            --grid-line: #d7dde3;
            --accent: #e8a33d;
            --accent-dark: #c9832a;
            --text-muted: #6b7280;
            --sidebar-text-muted: #8a93a6;
            --danger: #c0392b;
            --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
            --sans: -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--ink-900);
            font-family: var(--sans);
            height: 100vh;
            overflow: hidden;
            color: var(--ink-900);
        }
        button, input { font-family: inherit; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        #app {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        #sidebar {
            width: 280px;
            background: var(--ink-900);
            color: #fff;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        #brand {
            padding: 18px 16px 4px;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.12em;
            color: var(--sidebar-text-muted);
            text-transform: uppercase;
        }
        #brand strong { color: #fff; }
        #newChatBtn {
            margin: 12px 16px 16px;
            padding: 10px;
            border: 1px solid var(--accent);
            border-radius: 6px;
            background: transparent;
            color: var(--accent);
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.15s, color 0.15s;
        }
        #newChatBtn:hover { background: var(--accent); color: var(--ink-900); }
        #sessionListLabel {
            padding: 0 16px 8px;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--sidebar-text-muted);
        }
        #sessionList {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 10px;
        }
        .session-item {
            padding: 9px 10px 9px 12px;
            border-left: 3px solid transparent;
            border-radius: 6px;
            margin-bottom: 3px;
            cursor: pointer;
            font-size: 14px;
        }
        .session-item:hover { background: var(--ink-700); }
        .session-item.active { background: var(--ink-700); border-left-color: var(--accent); }
        .session-title {
            color: #f1f2f4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .session-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 3px;
        }
        .session-date {
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--sidebar-text-muted);
        }
        .session-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
            animation: pulse 2s ease-in-out infinite;
        }
        @media (prefers-reduced-motion: reduce) {
            .session-dot { animation: none; }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }
        .sidebar-placeholder {
            color: var(--sidebar-text-muted);
            font-size: 13px;
            padding: 14px 12px;
            line-height: 1.5;
        }

        /* Chat panel */
        #chatPanel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--paper);
        }
        #header {
            background: var(--paper-card);
            padding: 14px 20px;
            border-bottom: 1px solid var(--grid-line);
        }
        #headerEyebrow {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent-dark);
            margin-bottom: 3px;
        }
        #headerTitle {
            font-size: 18px;
            font-weight: 700;
            color: var(--ink-900);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #chatBox {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: var(--paper);
            background-image: radial-gradient(circle, var(--grid-line) 1px, transparent 1px);
            background-size: 22px 22px;
        }
        .placeholder {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin: auto 0;
        }
        .msg-row {
            display: flex;
        }
        .msg-bubble {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 10px;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 15px;
            line-height: 1.45;
        }
        .msg-user {
            background: var(--ink-900);
            color: #fff;
            border-bottom-right-radius: 3px;
        }
        .msg-assistant {
            background: var(--paper-card);
            color: var(--ink-900);
            border: 1px solid var(--grid-line);
            border-bottom-left-radius: 3px;
        }

        #inputBar {
            display: flex;
            padding: 14px 20px;
            border-top: 1px solid var(--grid-line);
            background: var(--paper-card);
        }
        #messageInput {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--grid-line);
            border-radius: 6px;
            outline: none;
            font-size: 15px;
        }
        #messageInput:focus { border-color: var(--accent); }
        #sendBtn {
            margin-left: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: var(--accent);
            color: var(--ink-900);
            cursor: pointer;
            font-weight: 700;
        }
        #sendBtn:hover { background: var(--accent-dark); }
        #inputBar.disabled { opacity: 0.6; pointer-events: none; }

        /* User id modal */
        #userIdOverlay {
            position: fixed;
            inset: 0;
            background: rgba(20, 23, 31, 0.72);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        #userIdCard {
            background: var(--paper-card);
            border-radius: 10px;
            border-top: 4px solid var(--accent);
            padding: 26px;
            width: 320px;
            box-shadow: 0 12px 30px rgba(0,0,0,.25);
        }
        #userIdEyebrow {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent-dark);
            margin-bottom: 6px;
        }
        #userIdCard h2 {
            margin: 0 0 14px;
            font-size: 18px;
            color: var(--ink-900);
        }
        #userIdInput {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--grid-line);
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }
        #userIdInput:focus { border-color: var(--accent); }
        #userIdSubmit {
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: var(--accent);
            color: var(--ink-900);
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
        }
        #userIdSubmit:hover { background: var(--accent-dark); }
        #userIdError {
            color: var(--danger);
            font-size: 13px;
            margin-top: 10px;
            display: none;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div id="app">
    <div id="sidebar">
        <div id="brand"><strong>AI Cohort</strong> / Session Log</div>
        <button id="newChatBtn" onclick="startNewChat()">+ New chat</button>
        <div id="sessionListLabel">Sessions</div>
        <div id="sessionList">
            <div class="sidebar-placeholder">No sessions yet. Start a new chat to begin.</div>
        </div>
    </div>

    <div id="chatPanel">
        <div id="header">
            <div id="headerEyebrow">Session Log</div>
            <div id="headerTitle">New chat</div>
        </div>
        <div id="chatBox">
            <div class="placeholder">Send a message to start this chat.</div>
        </div>
        <div id="inputBar">
            <input
                id="messageInput"
                type="text"
                placeholder="Message the assistant..."
                onkeypress="if(event.key==='Enter'){sendMessage();}"
            />
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<div id="userIdOverlay">
    <div id="userIdCard">
        <div id="userIdEyebrow">Identify</div>
        <h2>Enter your user ID</h2>
        <input id="userIdInput" type="text" placeholder="User ID" onkeypress="if(event.key==='Enter'){submitUserId();}" />
        <button id="userIdSubmit" onclick="submitUserId()">Continue</button>
        <div id="userIdError"></div>
    </div>
</div>

<script>
const state = {
    userId: null,
    currentSessionId: null,
    sessions: []
};

function setInputBarEnabled(enabled) {
    document.getElementById("inputBar").classList.toggle("disabled", !enabled);
}

function updateHeader(title) {
    document.getElementById("headerTitle").innerText = title;
}

async function submitUserId() {
    const input = document.getElementById("userIdInput");
    const errorEl = document.getElementById("userIdError");
    const userId = input.value.trim();

    if (!userId) {
        errorEl.innerText = "Enter a user ID to continue.";
        errorEl.style.display = "block";
        return;
    }

    errorEl.style.display = "none";

    try {
        const sessions = await fetchSessions(userId);
        state.userId = userId;
        state.sessions = sessions;
        document.getElementById("userIdOverlay").style.display = "none";
        renderSidebar();
    } catch (err) {
        console.error(err);
        errorEl.innerText = "Couldn't find that user ID. Check it and try again.";
        errorEl.style.display = "block";
    }
}

async function fetchSessions(userId) {
    const response = await fetch("/sessions?user_id=" + encodeURIComponent(userId));
    if (!response.ok) {
        throw new Error("Failed to load sessions: " + response.status);
    }
    const data = await response.json();
    return (data.sessions || []).sort(
        (a, b) => new Date(b.created_at) - new Date(a.created_at)
    );
}

function renderSidebar() {
    const listEl = document.getElementById("sessionList");
    listEl.innerHTML = "";

    if (state.sessions.length === 0) {
        listEl.innerHTML = '<div class="sidebar-placeholder">No sessions yet. Start a new chat to begin.</div>';
        return;
    }

    state.sessions.forEach(session => {
        const isActive = session.id === state.currentSessionId;

        const item = document.createElement("div");
        item.className = "session-item" + (isActive ? " active" : "");
        item.tabIndex = 0;
        item.setAttribute("role", "button");
        item.onclick = () => selectSession(session.id);
        item.onkeydown = (e) => {
            if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                selectSession(session.id);
            }
        };

        const title = document.createElement("div");
        title.className = "session-title";
        title.innerText = session.session_title || "Untitled";

        const meta = document.createElement("div");
        meta.className = "session-meta";

        if (isActive) {
            const dot = document.createElement("span");
            dot.className = "session-dot";
            meta.appendChild(dot);
        }

        const date = document.createElement("span");
        date.className = "session-date";
        date.innerText = new Date(session.created_at).toLocaleString();
        meta.appendChild(date);

        item.appendChild(title);
        item.appendChild(meta);
        listEl.appendChild(item);
    });
}

function clearChatBox() {
    document.getElementById("chatBox").innerHTML = "";
}

function showPlaceholder(text) {
    document.getElementById("chatBox").innerHTML = '<div class="placeholder">' + text + '</div>';
}

function addMessage(text, isUser) {
    const chatBox = document.getElementById("chatBox");
    const placeholder = chatBox.querySelector(".placeholder");
    if (placeholder) placeholder.remove();

    const row = document.createElement("div");
    row.className = "msg-row";
    row.style.justifyContent = isUser ? "flex-end" : "flex-start";

    const bubble = document.createElement("div");
    bubble.className = "msg-bubble " + (isUser ? "msg-user" : "msg-assistant");
    bubble.innerText = text;

    row.appendChild(bubble);
    chatBox.appendChild(row);
    chatBox.scrollTop = chatBox.scrollHeight;
    return row;
}

async function selectSession(sessionId) {
    state.currentSessionId = sessionId;
    renderSidebar();
    clearChatBox();
    showPlaceholder("Loading conversation...");

    const session = state.sessions.find(s => s.id === sessionId);
    updateHeader(session ? (session.session_title || "Untitled") : "Session");

    try {
        const response = await fetch("/messages?session_id=" + encodeURIComponent(sessionId));
        if (!response.ok) {
            throw new Error("Failed to load messages: " + response.status);
        }
        const data = await response.json();
        const messages = (data.messages || []).sort(
            (a, b) => new Date(a.created_at) - new Date(b.created_at)
        );

        clearChatBox();
        if (messages.length === 0) {
            showPlaceholder("No messages in this session yet.");
        } else {
            messages.forEach(m => addMessage(m.message, m.role === "user"));
        }
    } catch (err) {
        console.error(err);
        clearChatBox();
        showPlaceholder("Couldn't load this conversation. Select the session again to retry.");
    }
}

function startNewChat() {
    state.currentSessionId = null;
    renderSidebar();
    clearChatBox();
    showPlaceholder("Send a message to start this chat.");
    updateHeader("New chat");
    document.getElementById("messageInput").focus();
}

async function sendMessage() {
    const input = document.getElementById("messageInput");
    const message = input.value.trim();
    if (!message || !state.userId) return;

    const isNewSession = !state.currentSessionId;

    addMessage(message, true);
    input.value = "";
    setInputBarEnabled(false);

    const typingRow = addMessage("Typing...", false);

    try {
        const params = new URLSearchParams({
            message: message,
            user_id: state.userId
        });
        if (state.currentSessionId) {
            params.set("session_id", state.currentSessionId);
        }

        const response = await fetch("/chat?" + params.toString(), {
            method: "POST",
            headers: { "accept": "application/json" }
        });

        if (!response.ok) {
            throw new Error("Chat request failed: " + response.status);
        }

        const data = await response.json();
        typingRow.remove();
        addMessage(data.response || "No response received.", false);

        state.currentSessionId = data.session_id;

        if (isNewSession) {
            state.sessions = await fetchSessions(state.userId);
            const created = state.sessions.find(s => s.id === state.currentSessionId);
            updateHeader(created ? (created.session_title || "Untitled") : message);
        }
        renderSidebar();

    } catch (err) {
        typingRow.remove();
        addMessage("Couldn't reach the assistant. Try sending that again.", false);
        console.error(err);
    } finally {
        setInputBarEnabled(true);
        input.focus();
    }
}
</script>

</body>
</html>
