[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cohort"
version = "0.1.0"
requires-python = ">=3.12"

[tool.setuptools]
packages = [
    "server",
    "server.database",
    "server.routers",
    "server.tests",
    "rag",
]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
